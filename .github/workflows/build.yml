name: Build Shadow 4 Rootless

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/roothide/theos.git "$THEOS"

      - name: Install patched iOS 16.5 SDK
        run: |
          sudo mkdir -p "$THEOS/sdks"
          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

      - name: Force patched SDK
        run: |
          sed -i '' 's/iphone:clang:latest:15.0/iphone:clang:16.5:15.0/g' \
            Makefile \
            build.sh \
            .github/scripts/build-deps.sh

      - name: Build rootless dependencies
        run: |
          .github/scripts/build-deps.sh rootless

      - name: Build Shadow rootless
        run: |
          ./build.sh rootless

      - name: Show packages
        run: |
          ls -lah build/

      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-4.0.0-rootless
          path: build/*.deb
