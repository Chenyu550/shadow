name: Build Shadow 4 Rootless

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/roothide/theos.git "$THEOS"

      - name: Install patched iOS 16.5 SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/shadow-sdks"
          mkdir -p "$sdk_root"

          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$sdk_root"
          echo "PATCHED_SDKS_PATH=$sdk_root" >> "$GITHUB_ENV"

      - name: Vendor jailbreak XPC headers
        run: |
          set -euo pipefail

          curl -fL \
            https://github.com/Cryptiiiic/libjbdrw/archive/73fa4bb1bbd515ad11a96141ee9e8478f6146a15.tar.gz \
            -o "$RUNNER_TEMP/libjbdrw.tar.gz"

          tar -xzf "$RUNNER_TEMP/libjbdrw.tar.gz" -C "$RUNNER_TEMP"

          rm -rf "$PATCHED_SDKS_PATH/iPhoneOS16.5.sdk/usr/include/xpc"
          cp -R \
            "$RUNNER_TEMP/libjbdrw-73fa4bb1bbd515ad11a96141ee9e8478f6146a15/include/xpc" \
            "$PATCHED_SDKS_PATH/iPhoneOS16.5.sdk/usr/include/"

          xpc_header="$PATCHED_SDKS_PATH/iPhoneOS16.5.sdk/usr/include/xpc/connection.h"
          test -f "$xpc_header"
          grep -q "xpc_connection_create_mach_service" "$xpc_header"

          if grep -A3 -B3 \
            "xpc_connection_create_mach_service" "$xpc_header" \
            | grep -q "API_UNAVAILABLE(ios)"; then
            echo "ERROR: wrong XPC headers installed"
            exit 1
          fi

      - name: Build rootless dependencies
        run: .github/scripts/build-deps.sh rootless

      - name: Build Shadow rootless
        run: ./build.sh rootless

      - name: Show packages
        run: ls -lah build/

      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-4.0.0-rootless
          path: build/*.deb
