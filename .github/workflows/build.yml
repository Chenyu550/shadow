name: Build Shadow 4 Rootless

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/roothide/theos.git "$THEOS"

      - name: Install patched iOS 16.5 SDK
        run: |
          sudo mkdir -p "$THEOS/sdks"
          curl -fL \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

      - name: Force patched SDK
        run: |
          sed -i '' 's/iphone:clang:latest:15.0/iphone:clang:16.5:15.0/g' \
            Makefile \
            build.sh \
            .github/scripts/build-deps.sh
      - name: Fix BSD sed compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(".github/scripts/build-deps.sh")
          s = p.read_text()

          old = '''        sed "/^Architecture:/a Depends: firmware (>= $floor)" "$source" > "$output"'''

          new = '''        awk -v floor="$floor" '
                  /^Architecture:/ {
                      print
                      print "Depends: firmware (>= " floor ")"
                      next
                  }
                  { print }
              ' "$source" > "$output"'''

          if old not in s:
              raise SystemExit("Expected sed line not found")

          p.write_text(s.replace(old, new))
          PY

      - name: Add XPC headers to iOS 16.5 SDK
        shell: bash
        run: |
          set -euo pipefail

          DST="$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          MAC_SDK="$(xcrun --sdk macosx --show-sdk-path)"

          mkdir -p "$DST"

          # Prefer the current Xcode iPhoneOS SDK.
          if [ -d "$IOS_SDK/usr/include/xpc" ]; then
            echo "Using XPC headers from iPhoneOS SDK:"
            echo "$IOS_SDK/usr/include/xpc"
            cp -R "$IOS_SDK/usr/include/xpc" "$DST/"
          elif [ -d "$MAC_SDK/usr/include/xpc" ]; then
            echo "iPhoneOS SDK has no XPC headers; falling back to macOS SDK:"
            echo "$MAC_SDK/usr/include/xpc"
            cp -R "$MAC_SDK/usr/include/xpc" "$DST/"
          else
            echo "Could not find XPC headers in Xcode SDKs"
            exit 1
          fi

          echo "Installed XPC headers:"
          ls -la "$DST/xpc"
          test -f "$DST/xpc/xpc.h"
      - name: Build rootless dependencies
        run: |
          .github/scripts/build-deps.sh rootless

      - name: Build Shadow rootless
        run: |
          ./build.sh rootless

      - name: Show packages
        run: |
          ls -lah build/

      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-4.0.0-rootless
          path: build/*.deb
